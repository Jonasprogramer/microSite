	<script>
		document.addEventListener('DOMContentLoaded', () => {
		    const links = document.querySelectorAll('.btn-link'); // Certifique-se de usar essa classe nos seus botões
		    const orbit = document.querySelector('.orbit-ring');

		    links.forEach(link => {
		        // Ao passar o mouse
		        link.addEventListener('mouseenter', () => {
		            link.classList.add('btn-hover');
		            // Acelera o círculo quando passa o mouse nos links
		            orbit.style.animationDuration = '1s';
		        });

		        // Ao tirar o mouse
		        link.addEventListener('mouseleave', () => {
		            link.classList.remove('btn-hover');
		            // Volta a velocidade normal
		            orbit.style.animationDuration = '3s';
		        });
		    });
		});
	</script>
